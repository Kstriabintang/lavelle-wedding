<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Lavelle">
    <meta name="google-site-verification" content="Xr08hpFOzpnzkIgj95bElkylaKxKsDxtzqlKTdyQpIU" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
    <meta name="theme-color" content="#4a5436">
    <meta property="og:locale" content="id_ID">
    <meta property="og:site_name" content="Lavelle">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..500&family=Great+Vibes&family=Pinyon+Script&family=Jost:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <!-- Fonts tema /demo/royale/ (theme system) -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Alex+Brush&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Cormorant+Upright:wght@400;500;600;700&family=Marcellus&family=Tenor+Sans&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" type="image/png" href="/img/lavelle-logo.png">
    <link rel="apple-touch-icon" href="/img/lavelle-logo.png">

    <title>Lavelle — Jasa Undangan Pernikahan Digital Premium</title>

    <!-- Set tema sebelum paint (hindari flash) -->
    <script>
        (function () {
            try {
                var q = new URLSearchParams(location.search).get('theme');
                var t = (q === 'dark' || q === 'light') ? q : localStorage.getItem('lavelle-theme');
                if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                document.documentElement.dataset.theme = t;
            } catch (e) {}
        })();
    </script>
</head>

<body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
</body>

</html>
